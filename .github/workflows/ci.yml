name: CI
on: [push, pull_request]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install agent-core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pytest
      - name: Agent core + provider honesty tests
        run: python -m unittest discover -s tests -v

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus_owner
          POSTGRES_PASSWORD: nexus_owner
          POSTGRES_DB: nexus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: API, queue and RLS tests
        working-directory: services/api
        env:
          NEXUS_TEST_OWNER_URL: "postgresql://nexus_owner:nexus_owner@127.0.0.1:5432/nexus_test"
          NEXUS_TEST_APP_URL: "postgresql://nexus_app:ci-app-password-0123456789abcdef@127.0.0.1:5432/nexus_test"
          NEXUS_TEST_WORKER_URL: "postgresql://nexus_worker:ci-worker-password-0123456789abcdef@127.0.0.1:5432/nexus_test"
          # conftest grants LOGIN + these passwords to the NOLOGIN roles created by the migrations.
          NEXUS_APP_PASSWORD: "ci-app-password-0123456789abcdef"
          NEXUS_WORKER_PASSWORD: "ci-worker-password-0123456789abcdef"
          NEXUS_ALLOW_DESTRUCTIVE_TEST_DB: "1"
          NEXUS_BACKOFF_BASE: "0"
          JWT_SECRET: "ci-secret-not-for-production"
        run: python -m pytest -q

  legacy-backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Legacy service tests
        working-directory: backend
        env:
          ALLOW_REGISTRATION: "1"
          DATABASE_URL: "sqlite:///./test_ci.db"
          JWT_SECRET: "ci-secret"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python tests.py
