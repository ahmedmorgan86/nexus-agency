name: Daily Autonomous Marketing Swarm

on:
  schedule:
    # Runs at 07:00 AM UTC every day, which corresponds to 09:00 AM Egypt Time (UTC+2)
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub dashboard

jobs:
  run-swarm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Multi-Agent Marketing Swarm
        env:
          DIRECTOR_EMAIL: ${{ secrets.DIRECTOR_EMAIL || 'ahmed.morgan86@gmail.com' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python nexus_daily_swarm.py
